name: Update Visual Snapshots

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  update-snapshots:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-snapshots'
    runs-on: ubuntu-latest

    steps:
      - name: Determine branch
        id: branch
        run: echo "ref=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.branch.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate snapshots
        run: npm run test:e2e:update

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: update visual regression baselines"
          if [[ -n "${SNAPSHOT_PAT}" ]]; then
            PUSH_URL="https://x-access-token:${SNAPSHOT_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          else
            PUSH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git push "${PUSH_URL}" "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        env:
          SNAPSHOT_PAT: ${{ secrets.SNAPSHOT_PAT }}
          GH_TOKEN: ${{ github.token }}
