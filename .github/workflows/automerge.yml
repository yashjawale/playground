name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v2

      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major version updates
        if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          if gh pr view "$PR_URL" --json comments --jq '.comments[].body' | grep -q "Dependabot auto-merge: major version update"; then
            echo "Comment already exists, skipping"
          else
            gh pr comment "$PR_URL" --body "**Dependabot auto-merge: major version update** — merging automatically: ${{ steps.dependabot-metadata.outputs.dependency-names }}"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
