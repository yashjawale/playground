# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    cooldown:
      # Supply-chain mitigation: don't propose version updates until a release
      # is at least 7 days old (security updates are not affected).
      default-days: 7
    groups:
      # All dependencies update together in one grouped PR
      all:
        patterns:
          - '*'
        # typescript gets its own PR: @astrojs/check only supports ^5 || ^6,
        # so its major bump breaks npm ci for the whole group.
        exclude-patterns:
          - 'typescript'
    ignore:
      # Remove once @astrojs/check supports the next typescript major.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
